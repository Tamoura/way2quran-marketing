# deploy.yml reference in README.md remains valid.
name: Deploy (Vercel)
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel handles deployment
        run: echo "Deployment is managed by Vercel. See comments in this file for setup."
